# Deploy stack dev (docker-compose tại deploy/dev-server) lên VPS qua SSH.
#
# GitHub repository:
#   Secrets (Settings → Secrets → Actions):
#     DEV_SSH_HOST          — IP hoặc hostname (vd 14.x.x.x)
#     DEV_SSH_USER          — user SSH (vd deploy hoặc root)
#     DEV_SSH_PRIVATE_KEY   — (khuyến nghị) toàn bộ nội dung private key PEM
#     DEV_SSH_PASSWORD      — mật khẩu SSH nếu server chỉ bật password auth (kém an toàn hơn key)
#       → Chỉ dùng một trong hai: có key thì để trống password; không có key thì chỉ tạo DEV_SSH_PASSWORD.
#     DEV_SSH_KEY_PASSPHRASE — chỉ khi key có passphrase (tuỳ chọn)
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     DEV_DEPLOY_PATH       — đường dẫn clone repo trên server (vd /opt/xevn-ecosystem)
#
#   Nếu SSH không phải cổng 22: thêm key `port` vào step appleboy (vd 2222) hoặc dùng ProxyJump.

name: deploy-dev-server

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch hoặc tag để checkout trước khi deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (xác định commit SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Deploy qua SSH (git sync + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          passphrase: ${{ secrets.DEV_SSH_KEY_PASSPHRASE }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.DEV_DEPLOY_PATH }}"
            if [ -z "${DEPLOY_PATH}" ]; then
              echo "ERROR: Thiết lập repository variable DEV_DEPLOY_PATH (vd /opt/xevn-ecosystem)"
              exit 1
            fi
            cd "${DEPLOY_PATH}"
            echo "Deploy SHA=${{ github.sha }} path=$(pwd)"
            git fetch origin "${{ github.sha }}"
            git checkout -f "${{ github.sha }}"
            cd deploy/dev-server
            test -f .env || { echo "ERROR: Thiếu deploy/dev-server/.env trên server"; exit 1; }
            docker compose --env-file .env up -d --build
