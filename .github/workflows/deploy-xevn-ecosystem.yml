# Deploy stack (docker-compose tại deploy/xevn-ecosystem) lên VPS qua SSH.
#
# GitHub repository:
#   Secrets: DEV_SSH_HOST, DEV_SSH_USER, DEV_SSH_PRIVATE_KEY | DEV_SSH_PASSWORD, DEV_SSH_KEY_PASSPHRASE
#   Variables: DEV_DEPLOY_PATH
#   Variables (tuỳ chọn): DEV_PORTAL_FE_PORT — cổng portal trên host (mặc định smoke 28088)
#                         DEV_WEB_PORTAL_PORT — tương thích tên cũ nếu DEV_PORTAL_FE_PORT trống

name: deploy-xevn-ecosystem

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch hoặc tag để checkout trước khi deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-xevn-ecosystem
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (xác định commit SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Deploy qua SSH (git sync + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          passphrase: ${{ secrets.DEV_SSH_KEY_PASSPHRASE }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ vars.DEV_DEPLOY_PATH }}"
            if [ -z "${DEPLOY_PATH}" ]; then
              echo "ERROR: Thiết lập repository variable DEV_DEPLOY_PATH (vd /opt/xevn-ecosystem)"
              exit 1
            fi
            cd "${DEPLOY_PATH}"
            echo "Deploy SHA=${{ github.sha }} path=$(pwd)"
            git fetch origin "${{ github.sha }}"
            git checkout -f "${{ github.sha }}"
            if command -v node >/dev/null 2>&1; then
              node ./scripts/merge-vps-port-env.mjs --apply-canonical || true
              node ./scripts/xevn-ecosystem-bootstrap.mjs || true
            fi
            if [ ! -f deploy/xevn-ecosystem/.env ]; then
              cp deploy/xevn-ecosystem/.env.example deploy/xevn-ecosystem/.env
              echo "WARN: Đã tạo deploy/xevn-ecosystem/.env từ .env.example — điền DB_PASSWORD và secrets trên server."
            fi
            cd deploy/xevn-ecosystem
            docker compose --env-file .env up -d --build

      - name: Smoke portal (runner → VPS công khai)
        run: |
          set -euo pipefail
          H="${{ secrets.DEV_SSH_HOST }}"
          if [ -z "${H}" ]; then echo "SKIP: DEV_SSH_HOST trống"; exit 0; fi
          P="${{ vars.DEV_PORTAL_FE_PORT }}"
          if [ -z "${P}" ]; then P="${{ vars.DEV_WEB_PORTAL_PORT }}"; fi
          P="${P:-8088}"
          echo "Smoke http://${H}:${P}/command-center"
          curl -fsS -o /dev/null --connect-timeout 20 --max-time 30 \
            "http://${H}:${P}/command-center"
          curl -fsS -o /dev/null --connect-timeout 20 --max-time 30 \
            "http://${H}:${P}/"
          echo "Smoke OK (HTTP 2xx)"
