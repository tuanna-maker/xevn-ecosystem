# Profile: observability stack (Loki + Promtail + Prometheus + Grafana + OTel Collector)
# Usage: docker compose -f deploy/docker-compose.observability.yml --profile obs up -d
name: xevn-observability

services:
  loki:
    profiles: [obs]
    image: grafana/loki:3.0.0
    ports:
      - "${LOKI_PORT:-31010}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    profiles: [obs]
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.54.0
    ports:
      - "${PROMETHEUS_PORT:-31020}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-31030}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.109.0
    ports:
      - "${OTEL_GRPC_PORT:-31040}:4317"
      - "${OTEL_HTTP_PORT:-31041}:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

volumes:
  loki-data:
