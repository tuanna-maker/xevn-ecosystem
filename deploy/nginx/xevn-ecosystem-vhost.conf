# XeVN ecosystem — perimeter nginx (host-level, not Docker)
# Pilot TLS host: 14-225-217-232.nip.io (DNS → VPS IP; does not steal default :80 on raw IP)
# Production: replace server_name + ssl_certificate paths with corporate domains (portal.*, hrm-api.*, xbos-api.*)

map $http_x_request_id $xevn_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# HTTP — ACME + redirect to HTTPS (xevn hostname only)
server {
    listen 80;
    listen [::]:80;
    server_name 14-225-217-232.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — portal + API paths via portal-fe upstream (127.0.0.1:8088)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 14-225-217-232.nip.io;

    ssl_certificate /etc/letsencrypt/live/14-225-217-232.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/14-225-217-232.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API upstreams — longer timeouts + connect budget reduce 502 during Nest restart (P1-PHASE1-DO-STACK-STABILITY-01)
    location /api/hrm/ {
        proxy_pass http://127.0.0.1:3001/api/hrm/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $xevn_request_id;
    }

    location /api/xbos/ {
        proxy_pass http://127.0.0.1:28002/api/xbos/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $xevn_request_id;
    }

    # HRM Vite embed (base /hr/) — direct to hrm-fe; must precede portal catch-all.
    # Host $host (pilot nip.io) matches hrm vite allowedHosts:true (P1-EX-FE-HTTPS-ALLOWED-HOSTS-01).
    location /hr/ {
        proxy_pass http://127.0.0.1:8080/hr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $xevn_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $xevn_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
