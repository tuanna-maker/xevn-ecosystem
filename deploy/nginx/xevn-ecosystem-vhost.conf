# XeVN ecosystem — optional host-level nginx (not Docker)
# Canonical DEV portal (deploy SoT): http://14.225.217.232:8088  (PORTAL_FE_PORT)
# Local: http://127.0.0.1:5173 or http://127.0.0.1:8088
# Do not use wildcard/third-party DNS hosts in source. Corporate TLS: set server_name + cert paths explicitly.

map $http_x_request_id $xevn_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Optional HTTP reverse-proxy on :80 → portal-fe :8088 (same paths as compose Dev8088).
# Prefer direct http://14.225.217.232:8088 when host nginx is not required.
server {
    listen 80;
    listen [::]:80;
    server_name 14.225.217.232;

    server_tokens off;
    client_max_body_size 20m;

    location /api/hrm/ {
        proxy_pass http://127.0.0.1:3101/api/hrm/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $xevn_request_id;
    }

    location /api/xbos/ {
        proxy_pass http://127.0.0.1:28002/api/xbos/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $xevn_request_id;
    }

    location /hr/ {
        proxy_pass http://127.0.0.1:8080/hr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $xevn_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $xevn_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

