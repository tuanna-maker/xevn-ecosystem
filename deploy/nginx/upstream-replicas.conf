# P2.1 — horizontal API replicas behind nginx
upstream xevn_hrm_api {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3011 backup;
}

upstream xevn_xbos_api {
    least_conn;
    server 127.0.0.1:28002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:28102 backup;
}

server {
    listen 443 ssl http2;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/hrm/ {
        proxy_pass http://xevn_hrm_api;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/xbos/ {
        proxy_pass http://xevn_xbos_api;
        proxy_set_header X-Request-Id $request_id;
    }
}
