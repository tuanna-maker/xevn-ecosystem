# P2.1 / P1-HRM-SCALE-DO-W4 / HOLD-ERRBUDGET — horizontal API replicas (least_conn)
# Primary live LB on Dev8088: docker service `hrm-api-lb` (compose) on host :3101
#   → upstream hrm-be + hrm-be-2 + hrm-be-3 (see deploy/xevn-ecosystem/nginx/hrm-api-lb.conf)
# This file documents host-level upstreams for optional perimeter nginx (DEV HTTP → :3101).

upstream xevn_hrm_api {
    least_conn;
    # Align with compose hrm-api-lb (DO-W3-HOLD-STABILITY): do not mark peers down on RST bursts
    server 127.0.0.1:3001 max_fails=0;
    server 127.0.0.1:3011 max_fails=0;
    server 127.0.0.1:3012 max_fails=0;
    # optional 4th: 127.0.0.1:3013 (r2 regressed under hold — leave offline unless revalidated)
}

upstream xevn_xbos_api {
    least_conn;
    server 127.0.0.1:28002 max_fails=3 fail_timeout=30s;
    # Optional second XBOS replica when published:
    # server 127.0.0.1:28102 max_fails=3 fail_timeout=30s;
}
