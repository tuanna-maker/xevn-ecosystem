volumes:
  xevn_node_modules:

services:
  pnpm-install:
    image: node:22-alpine
    container_name: xevn-pnpm-install
    working_dir: /app
    volumes:
      - ../..:/app
      - xevn_node_modules:/app/node_modules
    environment:
      CI: 'true'
    command: sh -lc 'corepack enable && pnpm install --no-frozen-lockfile'
    restart: 'no'

  web-portal:
    image: node:22-alpine
    container_name: xevn-web-portal-dev
    working_dir: /app
    volumes:
      - ../..:/app
      - xevn_node_modules:/app/node_modules
    environment:
      CI: 'true'
      VITE_DEV_PROXY_HRM_WEB: 'http://hrm-web:8080'
      VITE_DEV_PROXY_HRM_API: 'http://hrm-api:3001'
      VITE_DEV_PROXY_XBOS_API: 'http://hrm-api:3001'
    command: sh -lc 'corepack enable && cd /app && pnpm --dir apps/web/web-portal exec vite -- --host 0.0.0.0 --port 5175'
    ports:
      - '8088:5175'
    depends_on:
      pnpm-install:
        condition: service_completed_successfully
    restart: unless-stopped

  hrm-web:
    image: node:22-alpine
    container_name: xevn-hrm-web-dev
    working_dir: /app
    volumes:
      - ../..:/app
      - xevn_node_modules:/app/node_modules
    environment:
      CI: 'true'
    command: sh -lc 'corepack enable && cd /app && pnpm --dir apps/web/hrm exec vite -- --host 0.0.0.0 --port 8080'
    ports:
      - '8080:8080'
    depends_on:
      pnpm-install:
        condition: service_completed_successfully
    restart: unless-stopped

  hrm-api:
    image: node:22-alpine
    container_name: xevn-hrm-api-dev
    working_dir: /app
    volumes:
      - ../..:/app
      - xevn_node_modules:/app/node_modules
    env_file:
      - ../../deploy/dev-server/.env
      - ../../apps/api/hrm-api/.env
    environment:
      CI: 'true'
    ports:
      - '3001:3001'
    command: sh -lc 'corepack enable && cd /app && pnpm --dir apps/api/hrm-api start:dev'
    depends_on:
      pnpm-install:
        condition: service_completed_successfully
    restart: unless-stopped
