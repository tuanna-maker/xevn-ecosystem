services:
  web-portal:
    image: node:22-alpine
    container_name: xevn-web-portal-dev
    working_dir: /app
    volumes:
      - ../..:/app
    command: sh -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm --dir apps/web-portal dev --host 0.0.0.0 --port 5175"
    ports:
      - "${WEB_PORTAL_PORT:-8088}:5175"
    restart: unless-stopped

  hrm-web:
    image: node:22-alpine
    container_name: xevn-hrm-web-dev
    working_dir: /app
    volumes:
      - ../..:/app
    command: sh -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm --dir apps/hrm dev --host 0.0.0.0 --port 8080"
    ports:
      - "${HRM_WEB_PORT:-8080}:8080"
    restart: unless-stopped

  xbos-core:
    image: node:22-alpine
    container_name: xevn-xbos-core-dev
    working_dir: /app
    volumes:
      - ../..:/app
    command: sh -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm --dir apps/x-bos-core dev --host 0.0.0.0 --port 5173"
    ports:
      - "${XBOS_CORE_PORT:-5173}:5173"
    restart: unless-stopped

  # HRM API pilot — env chung deploy/dev-server/.env rồi override apps/api/hrm-api/.env
  hrm-api:
    image: node:22-alpine
    container_name: xevn-hrm-api-dev
    working_dir: /app
    volumes:
      - ../..:/app
    env_file:
      - ../../deploy/dev-server/.env
      - ../../apps/api/hrm-api/.env
    ports:
      - "${HRM_API_PORT:-3001}:3001"
    command: sh -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm --dir apps/api/hrm-api start:dev"
    restart: unless-stopped

