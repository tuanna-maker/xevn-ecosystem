global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: hrm-api
    metrics_path: /api/hrm/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets:
          - host.docker.internal:3001
        labels:
          service: hrm-api

  - job_name: xbos-api
    metrics_path: /api/xbos/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets:
          - host.docker.internal:28002
        labels:
          service: xbos-api

rule_files:
  - /etc/prometheus/alerts.yml
