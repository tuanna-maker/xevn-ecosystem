groups:
  - name: xevn_api_slo
    rules:
      - alert: HighErrorRate5xx
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx error rate elevated
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency above 2s
      - alert: RateLimitSpike
        expr: rate(http_requests_total{code=~".*429.*"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Rate limit responses spiking
