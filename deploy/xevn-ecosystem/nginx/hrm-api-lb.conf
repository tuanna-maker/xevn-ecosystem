# P1-HRM-SCALE-DO-W4 / DO-W3-HOLD-STABILITY / HOLD-ERRBUDGET — in-compose least_conn LB
# Published on host :3101 for T-CONC probes (HRM_API_BASE=http://<host>:3101/api/hrm)
#
# HOLD cliff root cause: max_fails=3 + fail_timeout=30s marked BOTH peers down after
# brief Connection-reset bursts → "no live upstreams" → 502 cascade (~109s into 5min).
# Stability fix: max_fails=0 (never mark peers unavailable). Keep W4 keepalive pool
# for throughput (45s RERUN4 class); do not use aggressive proxy_next_upstream retries
# (amplifies load under saturation).
#
# ERRBUDGET: Nest keepAliveTimeout ≥65s (outlives upstream keepalive_timeout 60s);
# 3 peers + keepalive 128 (r2 4th peer regressed — abort 5%; r1 3-peer = 1.002%).

upstream xevn_hrm_api {
    least_conn;
    server hrm-be:3001 max_fails=0;
    server hrm-be-2:3001 max_fails=0;
    server hrm-be-3:3001 max_fails=0;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 20m;

    location /api/hrm/ {
        proxy_pass http://xevn_hrm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /healthz {
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}
