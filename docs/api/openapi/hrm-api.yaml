openapi: 3.1.0
info:
  title: XeVN HRM API — Phase 1 S3b (Metadata · Spreadsheet · Operations · Performance)
  version: 1.3.0-p1-s3b
  description: |
    Canonical REST contract for HRM khối C (Sprint 3) + U18 S3b extensions.
    Scope: internal JWT or x-internal-api-key; tenant/company via headers or body.
    List paths use resolveHrmListScope — group CEO company_id=main returns rollup partition.
    ADR: docs/decisions/ADR-HRM-RBAC-SCOPE-LADDER.md
servers:
  - url: /api/hrm
tags:
  - name: Platform
    description: Health, metrics (NFR)
  - name: Attendance
    description: HRM-AT-01..13 — records, update-requests, leave-requests (UC-HRM-23 embed)
  - name: Payroll
    description: HRM-PR-01..06 — periods, payslips, reconciliation (UC-HRM-24 embed)
  - name: Recruitment
    description: HRM-RC-01..06 — requisitions, candidates, interviews (UC-HRM-22 embed)
  - name: ContractsInsurance
    description: HRM-CI-01..07 — labor contracts and insurance (UC-HRM-25 embed)
  - name: Metadata
    description: HRM-MD-01..05 — employee metadata change queue (UC-HRM-26 embed)
  - name: Spreadsheet
    description: HRM-IM-01..04 — employee import/export
  - name: Operations
    description: HRM-OP-01..04 — tasks, summary, service requests (UC-HRM-MOB-11)
  - name: Performance
    description: HRM-PF-01..04 — performance cycles and evaluations
  - name: Employees
    description: HRM-EM-01..03 — employee CRUD, directory, summary aggregates
  - name: Decisions
    description: UC-HRM-27 — HR decisions CRUD (Implemented-empty)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
  parameters:
    CompanyIdQuery:
      name: company_id
      in: query
      required: true
      description: Company UUID or scope slug (main, holding, member slug per ADR scope ladder)
      schema: { type: string, minLength: 1, maxLength: 64 }
    TenantHeader:
      name: x-tenant-id
      in: header
      schema: { type: string }
    CompanyHeader:
      name: x-company-id
      in: header
      description: Company UUID or scope slug (main, holding, member slug)
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
    EmployeeSummary:
      type: object
      required:
        - company_id
        - total
        - active_count
        - inactive_count
        - archived_count
        - payroll
        - by_department
        - salary_ranges
        - new_hires
      properties:
        company_id: { type: string }
        total: { type: integer, minimum: 0 }
        active_count: { type: integer, minimum: 0 }
        inactive_count: { type: integer, minimum: 0 }
        archived_count: { type: integer, minimum: 0 }
        payroll:
          type: object
          required: [total, employees_with_salary]
          properties:
            total: { type: number }
            employees_with_salary: { type: integer, minimum: 0 }
        by_department:
          type: array
          items:
            type: object
            required: [department, count, avg_salary]
            properties:
              department: { type: string }
              count: { type: integer, minimum: 0 }
              avg_salary: { type: number, nullable: true }
        salary_ranges:
          type: array
          items:
            type: object
            required: [key, min, max, count]
            properties:
              key: { type: string }
              min: { type: number }
              max: { type: number, nullable: true }
              count: { type: integer, minimum: 0 }
        new_hires:
          type: object
          required: [last_30_days, recent]
          properties:
            last_30_days: { type: integer, minimum: 0 }
            recent:
              type: array
              items:
                type: object
                required: [id, employee_code, full_name, status, hired_at, avatar_url]
                properties:
                  id: { type: string, format: uuid }
                  employee_code: { type: string }
                  full_name: { type: string }
                  status: { type: string }
                  hired_at: { type: string, format: date, nullable: true }
                  avatar_url: { type: string, nullable: true }
    HrDecision:
      type: object
      required:
        - id
        - company_id
        - decision_code
        - decision_type
        - title
        - employee_name
        - status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string }
        decision_code: { type: string }
        decision_type: { type: string }
        title: { type: string }
        content: { type: string, nullable: true }
        employee_id: { type: string, format: uuid, nullable: true }
        employee_name: { type: string }
        employee_code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        position: { type: string, nullable: true }
        effective_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        signer_name: { type: string, nullable: true }
        signer_position: { type: string, nullable: true }
        signing_date: { type: string, format: date, nullable: true }
        file_url: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HrDecisionList:
      type: object
      required: [total, page, page_size, data]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        data:
          type: array
          items:
            $ref: '#/components/schemas/HrDecision'
    CreateDecisionRequest:
      type: object
      required: [company_id, decision_type, employee_name]
      properties:
        company_id: { type: string, minLength: 1, maxLength: 64 }
        decision_code: { type: string, maxLength: 64 }
        decision_type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 512 }
        content: { type: string }
        decision_date: { type: string, format: date }
        reason: { type: string }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string, maxLength: 256 }
        employee_code: { type: string, maxLength: 64 }
        department: { type: string, maxLength: 128 }
        position: { type: string, maxLength: 128 }
        effective_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        signer_name: { type: string, maxLength: 256 }
        signer_position: { type: string, maxLength: 128 }
        signing_date: { type: string, format: date }
        file_url: { type: string }
        status: { type: string, maxLength: 32 }
        notes: { type: string }
    UpdateDecisionRequest:
      type: object
      properties:
        company_id: { type: string, minLength: 1, maxLength: 64 }
        decision_code: { type: string, maxLength: 64 }
        decision_type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 512 }
        content: { type: string }
        decision_date: { type: string, format: date }
        reason: { type: string }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string, maxLength: 256 }
        employee_code: { type: string, maxLength: 64 }
        department: { type: string, maxLength: 128 }
        position: { type: string, maxLength: 128 }
        effective_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        signer_name: { type: string, maxLength: 256 }
        signer_position: { type: string, maxLength: 128 }
        signing_date: { type: string, format: date }
        file_url: { type: string }
        status: { type: string, maxLength: 32 }
        notes: { type: string }
paths:
  /:
    get:
      tags: [Platform]
      operationId: hrmHealth
      summary: UC-HRM-01 service health
      responses:
        '200':
          description: Health envelope (HRM-HEALTH-200)
  /metrics:
    get:
      tags: [Platform]
      operationId: hrmMetrics
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [prometheus] }
      responses:
        '200':
          description: Metrics JSON or Prometheus text
  /employees/summary:
    get:
      tags: [Employees]
      operationId: getEmployeesSummary
      summary: P1-HRM-PERF-BE-01 — dashboard employee aggregates (single round-trip)
      description: |
        Returns scoped counts, payroll totals, department breakdown, salary ranges, and recent hires.
        Uses the same resolveHrmListScope filters as GET /employees (group CEO company_id=main rollup).
        Replaces N sequential paginated list calls for dashboard/count widgets.
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Employee summary envelope (HRM-EMP-SUMMARY-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeSummary'
        '401':
          description: Unauthorized (HRM-AUTH-001)
  /employees/{employeeId}:
    get:
      operationId: getEmployeeById
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Employee envelope (HRM-EMP-200)
        '404':
          description: Employee not found (HRM-EMP-404)
  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: UC-HRM-27 — list HR decisions
      description: |
        Returns a scoped decision list. Empty result sets are valid live responses (`total: 0`, `data: []`).
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: decision_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: status
          in: query
          schema: { type: string, maxLength: 32 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Decisions listed (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecisionList'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '409':
          description: SCOPE_CONTEXT_MISMATCH
    post:
      tags: [Decisions]
      operationId: createDecision
      summary: UC-HRM-27 — create HR decision
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision created (HRM-DEC-201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecision'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /decisions/{decisionId}:
    get:
      tags: [Decisions]
      operationId: getDecisionById
      summary: UC-HRM-27 — get HR decision by id
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200':
          description: Decision detail (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecision'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '404':
          description: Decision not found (HRM-DEC-404)
        '409':
          description: Scope mismatch (HRM-DEC-409)
    patch:
      tags: [Decisions]
      operationId: updateDecision
      summary: UC-HRM-27 — update HR decision
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: company_id
          in: query
          description: Required unless supplied in body or x-company-id header
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: Decision updated (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecision'
        '400':
          description: company_id is required (HRM-DEC-002)
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '404':
          description: Decision not found (HRM-DEC-404)
        '409':
          description: Scope mismatch (HRM-DEC-409)
    delete:
      tags: [Decisions]
      operationId: deleteDecision
      summary: UC-HRM-27 — delete HR decision
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200':
          description: Decision deleted (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { type: string, format: uuid }
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '404':
          description: Decision not found (HRM-DEC-404)
        '409':
          description: Scope mismatch (HRM-DEC-409)
  /attendance/records:
    post:
      tags: [Attendance]
      operationId: createAttendanceRecord
      summary: HRM-AT-01
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, employee_id, attendance_date, status]
      responses:
        '200':
          description: HRM-AT-201
    get:
      tags: [Attendance]
      operationId: listAttendanceRecords
      summary: HRM-AT-02
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/records/{recordId}/status:
    patch:
      tags: [Attendance]
      operationId: updateAttendanceRecordStatus
      summary: HRM-AT-03
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/update-requests:
    post:
      tags: [Attendance]
      operationId: createAttendanceUpdateRequest
      summary: HRM-AT-04
      responses:
        '200':
          description: HRM-AT-201
    get:
      tags: [Attendance]
      operationId: listAttendanceUpdateRequests
      summary: HRM-AT-05
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-AT-200
  /attendance/update-requests/{requestId}:
    patch:
      tags: [Attendance]
      operationId: patchAttendanceUpdateRequest
      summary: HRM-AT-06
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
    delete:
      tags: [Attendance]
      operationId: deleteAttendanceUpdateRequest
      summary: HRM-AT-09
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/update-requests/{requestId}/approve:
    post:
      tags: [Attendance]
      operationId: approveAttendanceUpdateRequest
      summary: HRM-AT-07
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/update-requests/{requestId}/reject:
    post:
      tags: [Attendance]
      operationId: rejectAttendanceUpdateRequest
      summary: HRM-AT-08
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/leave-requests:
    post:
      tags: [Attendance]
      operationId: createLeaveRequest
      summary: HRM-AT-10
      responses:
        '200':
          description: HRM-AT-201
    get:
      tags: [Attendance]
      operationId: listLeaveRequests
      summary: HRM-AT-11
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-AT-200
  /attendance/leave-requests/{requestId}/approve:
    post:
      tags: [Attendance]
      operationId: approveLeaveRequest
      summary: HRM-AT-12
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /attendance/leave-requests/{requestId}/reject:
    post:
      tags: [Attendance]
      operationId: rejectLeaveRequest
      summary: HRM-AT-13
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-AT-200
  /payroll/periods:
    post:
      tags: [Payroll]
      operationId: createPayrollPeriod
      summary: HRM-PR-01
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-PR-201
    get:
      tags: [Payroll]
      operationId: listPayrollPeriods
      summary: HRM-PR-02
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-PR-200
  /payroll/periods/{periodId}/process:
    post:
      tags: [Payroll]
      operationId: processPayrollPeriod
      summary: HRM-PR-03
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-PR-200
  /payroll/periods/{periodId}/close:
    post:
      tags: [Payroll]
      operationId: closePayrollPeriod
      summary: HRM-PR-04
      parameters:
        - name: periodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-PR-200
  /payroll/payslips:
    get:
      tags: [Payroll]
      operationId: listPayslips
      summary: HRM-PR-05
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-PR-200
  /payroll/reports/reconciliation:
    get:
      tags: [Payroll]
      operationId: payrollReconciliationReport
      summary: HRM-PR-06
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-PR-200
  /recruitment/requisitions:
    post:
      tags: [Recruitment]
      operationId: createJobRequisition
      summary: HRM-RC-01
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-REC-201
    get:
      tags: [Recruitment]
      operationId: listJobRequisitions
      summary: HRM-RC-02
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-REC-200
  /recruitment/candidates:
    post:
      tags: [Recruitment]
      operationId: createCandidate
      summary: HRM-RC-03
      responses:
        '200':
          description: HRM-REC-202
    get:
      tags: [Recruitment]
      operationId: listCandidates
      summary: HRM-RC-04
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-REC-200
  /recruitment/interviews:
    post:
      tags: [Recruitment]
      operationId: scheduleInterview
      summary: HRM-RC-05
      responses:
        '200':
          description: HRM-REC-203
  /recruitment/interviews/{interviewId}/status:
    patch:
      tags: [Recruitment]
      operationId: updateInterviewStatus
      summary: HRM-RC-06
      parameters:
        - name: interviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-REC-204
  /contracts-insurance/contracts:
    post:
      tags: [ContractsInsurance]
      operationId: createLaborContract
      summary: HRM-CI-01
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-CON-201
    get:
      tags: [ContractsInsurance]
      operationId: listLaborContracts
      summary: HRM-CI-03
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/contracts/expiring:
    get:
      tags: [ContractsInsurance]
      operationId: listExpiringContracts
      summary: HRM-CI-04
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/contracts/{contractId}:
    patch:
      tags: [ContractsInsurance]
      operationId: updateLaborContract
      summary: HRM-CI-05
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-CON-200
    delete:
      tags: [ContractsInsurance]
      operationId: deleteLaborContract
      summary: HRM-CI-06
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
