  /admin/platform-admin:
    post:
      tags: [Admin]
      operationId: adminCreatePlatformAdmin
      summary: FR-HRM-02 / HRM-ADMIN-201 — create platform admin
      description: |
        API_DESIGN Endpoint A (F.1) · docs/hrm/API_DESIGN_HRM_ADMIN.md §A ·
        DB_DESIGN_HRM_ADMIN.md · profiles + platform_admins.
        Mục đích: Cho phép quản trị nền tảng được ủy quyền tạo (hoặc upsert grant) tài khoản
        quản trị nền tảng — ghi profiles + platform_admins — để vận hành cấu hình cấp nền tảng
        và mở khóa UC-HRM-03.
        Nghiệp vụ: Auth Bearer (HRM-AUTH-001) → assertPlatformAdmin (role platform_admin|group_ceo
        OR platform_admins grant → else HRM-AUTH-002) → validate email + password≥8 →
        findOrCreatePortalUser (profiles SHA-256) → UPSERT platform_admins on user_id
        (G-ADM-03 upsert, not hard-fail duplicate) → HRM-ADMIN-201 { success, user_id } —
        never echo password.
        Bước SRS: FR-HRM-02 / UC-HRM-02 Diễn biến #1/#3/#6/#8 (khách SRS_HRM_KHACH.md §3.24).
        Runtime: HrmAdminController.createPlatformAdmin → HrmAdminService.createPlatformAdmin.
        must_keep: G-ADM-DTO-01 CLOSED behavior · Auth/Tenant JWT cite · U65 · HOLD_DEPLOY · no plaintext.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformAdminRequest'
            examples:
              createOk:
                summary: FR-HRM-02 #6 Lưu thành công
                value:
                  email: platform.admin@xe.vn
                  password: Xevn@2026
                  full_name: Platform Admin
      responses:
        '200':
          description: HRM-ADMIN-201 — Platform admin created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      code: { type: string, const: HRM-ADMIN-201 }
                      data:
                        $ref: '#/components/schemas/CreatePlatformAdminData'
              examples:
                platformAdminCreated:
                  summary: FR-HRM-02 #8 Thành công cuối
                  value:
                    code: HRM-ADMIN-201
                    message: Platform admin created
                    data:
                      success: true
                      user_id: 11111111-1111-4111-8111-111111111111
        '400':
          description: Validation — invalid email / password < 8 (FR-02 #3)
        '401':
          description: HRM-AUTH-001 — Unauthorized
        '403':
          description: HRM-AUTH-002 — Not platform admin
