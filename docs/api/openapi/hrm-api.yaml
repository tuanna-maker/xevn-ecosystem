        Mục đích: Gán hoặc cập nhật quản trị doanh nghiệp cho một đơn vị đích — tạo/khôi phục
        profiles và UPSERT user_company_memberships với role quản trị — để HCNS đơn vị vận hành
        và mở khóa mời nhân viên (UC-HRM-04).
        Nghiệp vụ: Auth + assertPlatformAdmin → validate email, password≥8, company_id TEXT
        MaxLength(64) Plane B slug|UUID-as-text (G-ADM-DTO-01 CLOSED) → findOrCreatePortalUser →
        UPSERT membership (role default admin, status active) → HRM-ADMIN-202
        { success, user_id, is_existing_user } — no plaintext password.
        Bước SRS: FR-HRM-03 / UC-HRM-03 Diễn biến #1/#2/#4/#6/#8 (khách SRS_HRM_KHACH.md §3.25).
        Runtime: HrmAdminController.createCompanyAdmin → HrmAdminService.createCompanyAdmin.
        Example company_id: holding (TEXT slug — not UUID-only DTO).
