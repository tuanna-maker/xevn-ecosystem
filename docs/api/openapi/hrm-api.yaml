    post:
      tags: [Admin]
      operationId: adminCreateCompanyAdmin
      summary: FR-HRM-03 / HRM-ADMIN-202 — create or update company admin
      description: |
        API_DESIGN Endpoint B (F.1) · docs/hrm/API_DESIGN_HRM_ADMIN.md §B ·
