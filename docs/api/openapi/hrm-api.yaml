          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-OPS-202
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /operations/reports/summary:
    get:
      tags: [Operations]
      operationId: opsSummary
      summary: HRM-OP-04 — operations summary report
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-OPS-200
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /operations/service-requests:
    post:
      tags: [Operations]
      operationId: opsServiceRequestCreate
      summary: HRM-SV-01 — create service request
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-SVC-201
    get:
      tags: [Operations]
      operationId: opsServiceRequestList
      summary: HRM-SV-02 — list service requests
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-SVC-200
  /performance/cycles:
    post:
      tags: [Performance]
      operationId: perfCycleCreate
      summary: HRM-PF-01 — create performance cycle
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-PERF-201
        '409':
          description: SCOPE_CONTEXT_MISMATCH
    get:
      tags: [Performance]
      operationId: perfCycleList
      summary: HRM-PF-02 — list performance cycles
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-PERF-200
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /performance/evaluations:
    post:
      tags: [Performance]
      operationId: perfEvalCreate
      summary: HRM-PF-03 — create performance evaluation
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: HRM-PERF-202
        '409':
          description: SCOPE_CONTEXT_MISMATCH
    get:
      tags: [Performance]
      operationId: perfEvalList
      summary: HRM-PF-04 — list performance evaluations
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: cycle_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-PERF-200
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /auth/mobile/login:
    post:
      operationId: mobileLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login success envelope
