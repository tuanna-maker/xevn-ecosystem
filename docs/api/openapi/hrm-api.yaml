  /recruitment/candidates:
    post:
      tags: [Recruitment]
      operationId: createCandidate
      summary: HRM-RC-03
      responses:
        '200':
          description: HRM-REC-202
    get:
      tags: [Recruitment]
      operationId: listCandidates
