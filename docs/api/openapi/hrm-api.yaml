openapi: 3.1.0
info:
  title: XeVN HRM API — Phase 1 S3b (Metadata · Spreadsheet · Operations · Performance · Admin)
  version: 1.3.5-admin-f1
  description: |
    Canonical REST contract for HRM khối C (Sprint 3) + U18 S3b extensions.
    Scope: internal JWT or x-internal-api-key; tenant/company via headers or body.
    List paths use resolveHrmListScope — group CEO company_id=main returns rollup partition.
    ADR: docs/decisions/ADR-HRM-RBAC-SCOPE-LADDER.md
    CD-FB-05: GET /employees supports optional keyset `cursor` + `next_cursor` (ADR-HRM-SCALE §5.4).
    BE-HRM-OA-IMPORT-FLEET-01: F.1 deepen POST /spreadsheet/import/preview (multipart, non-persist)
    + GET /fleet/vehicles (FL-01 list only). Physical: API_DESIGN_HRM_IMPORT_PREVIEW · API_DESIGN_HRM_FLEET.
    BE-HRM-IM-PREVIEW-HTTP-ALIGN-01: sheetPreview success = HTTP 200 + SHEET-200 (Nest @HttpCode OK; not 201).
    BE-HRM-FLEET-KEYWORD-01: GET /fleet/vehicles optional keyword|q (plate + name in fleet_fields) — closes G-FL-02.
    BE-HRM-OA-ADMIN-01: F.1 deepen POST /admin/platform-admin · company-admin · invite-employee ·
    reset-user-password (FR-HRM-02..05 · API_DESIGN_HRM_ADMIN). company_id TEXT Plane B slug (G-ADM-DTO-01 CLOSED).
servers:
  - url: /api/hrm
tags:
  - name: Platform
    description: Health, metrics (NFR)
  - name: Attendance
    description: HRM-AT-01..13 — records, update-requests, leave-requests (UC-HRM-23 embed)
  - name: Payroll
    description: HRM-PR-01..06 — periods, payslips, reconciliation (UC-HRM-24 embed)
  - name: Recruitment
    description: HRM-RC-01..06 — requisitions, candidates, interviews (UC-HRM-22 embed)
  - name: ContractsInsurance
    description: HRM-CI-01..07 — labor contracts and insurance (UC-HRM-25 embed)
  - name: Metadata
    description: HRM-MD-01..05 — employee metadata change queue (UC-HRM-26 embed)
  - name: Spreadsheet
    description: HRM-IM-01..04 — employee import/export · IM-01 preview non-persist (SHEET-200)
  - name: Fleet
    description: FR-HRM-FL-01 — fleet vehicles list only (HRM-FLEET-200); no public mutate
  - name: Operations
    description: HRM-OP-01..04 — tasks, summary, service requests (UC-HRM-MOB-11)
  - name: Performance
    description: HRM-PF-01..04 — performance cycles and evaluations
  - name: Admin
    description: |
      FR-HRM-02..05 — platform/company admin, invite batch, reset credentials
      (HRM-ADMIN-201..204). Physical: docs/hrm/API_DESIGN_HRM_ADMIN.md.
      company_id TEXT Plane B (slug|UUID-as-text); user_id reset = UUID profiles plane.
  - name: Employees
    description: HRM-EM-01..03 — employee CRUD, directory, summary aggregates
  - name: Decisions
    description: UC-HRM-27 — HR decisions CRUD (Implemented-empty)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
  parameters:
    CompanyIdQuery:
      name: company_id
      in: query
      required: true
      description: Company UUID or scope slug (main, holding, member slug per ADR scope ladder)
      schema: { type: string, minLength: 1, maxLength: 64 }
    TenantHeader:
      name: x-tenant-id
      in: header
      schema: { type: string }
    CompanyHeader:
      name: x-company-id
      in: header
      description: Company UUID or scope slug (main, holding, member slug)
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
    EmployeeSummary:
      type: object
      required:
        - company_id
        - total
        - active_count
        - inactive_count
        - archived_count
        - payroll
        - by_department
        - by_company
        - salary_ranges
        - new_hires
      properties:
        company_id: { type: string }
        total: { type: integer, minimum: 0 }
        active_count: { type: integer, minimum: 0 }
        inactive_count: { type: integer, minimum: 0 }
        archived_count: { type: integer, minimum: 0 }
        payroll:
          type: object
          required: [total, employees_with_salary]
          properties:
            total: { type: number }
            employees_with_salary: { type: integer, minimum: 0 }
        by_department:
          type: array
          items:
            type: object
            required: [department, count, avg_salary]
            properties:
              department: { type: string }
              count: { type: integer, minimum: 0 }
              avg_salary: { type: number, nullable: true }
        by_company:
          type: array
          description: |
            D-HRM-CO-EMP-COUNT-BE-01 / GOV-HRM-CO-EMP-TS-01 — per operating-slug headcount (Plane B).
            ref_srs: FR-HRM-CO-HC-01 / UC-HRM-CO-01 · TechSpec docs/hrm/TECHSPEC.md §19.
            company_id ∈ {holding,trsport,logistics,finance,services}; never XBOS legal-entity UUID.
            Group CEO company_id=main zero-fills all 5 slugs under same resolveHrmListScope as list.
            FE: map ĐVTV → operating_slug → by_company[].total; API fail → UI em-dash not silent 0.
          items:
            type: object
            required: [company_id, total, active_count, inactive_count, archived_count]
            properties:
              company_id:
                type: string
                enum: [holding, trsport, logistics, finance, services]
              total: { type: integer, minimum: 0 }
              active_count: { type: integer, minimum: 0 }
              inactive_count: { type: integer, minimum: 0 }
              archived_count: { type: integer, minimum: 0 }
        salary_ranges:
          type: array
          items:
            type: object
            required: [key, min, max, count]
            properties:
              key: { type: string }
              min: { type: number }
              max: { type: number, nullable: true }
              count: { type: integer, minimum: 0 }
        new_hires:
          type: object
          required: [last_30_days, recent]
          properties:
            last_30_days: { type: integer, minimum: 0 }
            recent:
              type: array
              items:
                type: object
                required: [id, employee_code, full_name, status, hired_at, avatar_url]
                properties:
                  id: { type: string, format: uuid }
                  employee_code: { type: string }
                  full_name: { type: string }
                  status: { type: string }
                  hired_at: { type: string, format: date, nullable: true }
                  avatar_url: { type: string, nullable: true }
    EmployeeListPage:
      type: object
      required: [total, page, page_size, next_cursor, data]
      description: |
        CD-FB-05 — OFFSET (`page`) remains default. Optional `cursor` switches to keyset
        (created_at DESC, id DESC). `next_cursor` is null when no further page.
        `total` is always the full scoped count (not remaining-after-cursor).
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        next_cursor:
          type: string
          nullable: true
          description: Opaque keyset cursor for the next page (base64url of created_at + id)
        data:
          type: array
          items: { type: object }
    HrDecision:
      type: object
      required:
        - id
        - company_id
        - decision_code
        - decision_type
        - title
        - employee_name
        - status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string }
        decision_code: { type: string }
        decision_type: { type: string }
        title: { type: string }
        content: { type: string, nullable: true }
        employee_id: { type: string, format: uuid, nullable: true }
        employee_name: { type: string }
        employee_code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        position: { type: string, nullable: true }
        effective_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        signer_name: { type: string, nullable: true }
        signer_position: { type: string, nullable: true }
        signing_date: { type: string, format: date, nullable: true }
        file_url: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HrDecisionList:
      type: object
      required: [total, page, page_size, data]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        data:
          type: array
          items:
            $ref: '#/components/schemas/HrDecision'
    CreateDecisionRequest:
      type: object
      required: [company_id, decision_type, employee_name]
      properties:
        company_id: { type: string, minLength: 1, maxLength: 64 }
        decision_code: { type: string, maxLength: 64 }
        decision_type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 512 }
        content: { type: string }
        decision_date: { type: string, format: date }
        reason: { type: string }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string, maxLength: 256 }
        employee_code: { type: string, maxLength: 64 }
        department: { type: string, maxLength: 128 }
        position: { type: string, maxLength: 128 }
        effective_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        signer_name: { type: string, maxLength: 256 }
        signer_position: { type: string, maxLength: 128 }
        signing_date: { type: string, format: date }
        file_url: { type: string }
        status: { type: string, maxLength: 32 }
        notes: { type: string }
    UpdateDecisionRequest:
      type: object
      properties:
        company_id: { type: string, minLength: 1, maxLength: 64 }
        decision_code: { type: string, maxLength: 64 }
        decision_type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 512 }
        content: { type: string }
        decision_date: { type: string, format: date }
        reason: { type: string }
        employee_id: { type: string, format: uuid }
        employee_name: { type: string, maxLength: 256 }
        employee_code: { type: string, maxLength: 64 }
        department: { type: string, maxLength: 128 }
        position: { type: string, maxLength: 128 }
        effective_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        signer_name: { type: string, maxLength: 256 }
        signer_position: { type: string, maxLength: 128 }
        signing_date: { type: string, format: date }
        file_url: { type: string }
        status: { type: string, maxLength: 32 }
        notes: { type: string }
    SheetRowError:
      type: object
      required: [row, code]
      description: Per-row validation error on import preview (still HTTP 200 with SHEET-200)
      properties:
        row: { type: integer, minimum: 1 }
        field: { type: string }
        code: { type: string, example: SHEET-422 }
        message: { type: string }
    ImportPreviewRow:
      type: object
      required: [employee_code, email, full_name, job_title_key, hired_at]
      description: Canonical preview fields — logical map to employees at IM-02 commit only (no persist on preview)
      properties:
        employee_code: { type: string }
        email: { type: string }
        full_name: { type: string }
        job_title_key: { type: string }
        hired_at: { type: string }
    ImportPreviewData:
      type: object
      required:
        - kind
        - headersDetected
        - canonicalHeaders
        - rowCount
        - previewRows
        - truncated
        - errors
        - dryRun
      description: |
        In-memory preview payload (DB_DESIGN_HRM_IMPORT_PREVIEW = N/A table).
        must_keep: zero INSERT/UPDATE employees on this path (FR-HRM-IM-01 #7).
      properties:
        kind: { type: string, const: employee_import }
        headersDetected:
          type: array
          items: { type: string }
        canonicalHeaders:
          type: array
          items: { type: string }
        rowCount: { type: integer, minimum: 0 }
        previewRows:
          type: array
          items:
            $ref: '#/components/schemas/ImportPreviewRow'
        truncated: { type: boolean }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SheetRowError'
        dryRun: { type: boolean }
    FleetVehicle:
      type: object
      required:
        - id
        - tenant_id
        - company_id
        - license_plate
        - fleet_fields
        - status
        - created_at
        - updated_at
      description: Row from public.hrm_fleet_vehicles (Plane B TEXT company_id slug)
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        company_id:
          type: string
          description: Plane B operating slug (xe-du-lich, holding, …) — not XBOS LE UUID
        license_plate: { type: string }
        fleet_fields:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FleetVehicleList:
      type: object
      required: [total, data]
      properties:
        total: { type: integer, minimum: 0 }
        data:
          type: array
          items:
            $ref: '#/components/schemas/FleetVehicle'
    CreatePlatformAdminRequest:
      type: object
      required: [email, password]
      description: CreatePlatformAdminDto — FR-HRM-02 (no company_id)
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
    CreatePlatformAdminData:
      type: object
      required: [success, user_id]
      properties:
        success: { type: boolean, const: true }
        user_id: { type: string, format: uuid }
    CreateCompanyAdminRequest:
      type: object
      required: [email, password, company_id]
      description: |
        CreateCompanyAdminDto — FR-HRM-03.
        company_id TEXT MaxLength(64) Plane B slug (`holding`, member) or UUID-as-text — G-ADM-DTO-01 CLOSED.
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        company_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Plane B operating slug (holding, trsport, …) or UUID-as-text — not LE-only UUID DTO
          example: holding
        role:
          type: string
          description: Default admin when omitted
    CreateCompanyAdminData:
      type: object
      required: [success, user_id, is_existing_user]
      properties:
        success: { type: boolean, const: true }
        user_id: { type: string, format: uuid }
        is_existing_user: { type: boolean }
    InviteEmployeeItem:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        full_name: { type: string }
        employee_id:
          type: string
          format: uuid
          description: Optional soft link → employees.id (UUID); omit for account-only invite
    InviteEmployeesRequest:
      type: object
      required: [company_id, employees]
      description: |
        InviteEmployeesDto — FR-HRM-04.
        company_id TEXT Plane B; employees ArrayMinSize(1).
      properties:
        company_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Plane B TEXT slug or UUID-as-text
          example: holding
        employees:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InviteEmployeeItem'
    InviteEmployeeResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        email: { type: string }
        user_id: { type: string, format: uuid }
        error: { type: string }
    InviteEmployeesData:
      type: object
      required: [success, total, invited, failed, results]
      properties:
        success: { type: boolean, const: true }
        total: { type: integer, minimum: 0 }
        invited: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/InviteEmployeeResult'
    ResetUserPasswordRequest:
      type: object
      required: [user_id]
      description: |
        ResetUserPasswordDto — FR-HRM-05.
        user_id UUID (profiles.user_id) — ≠ XBOS Auth TEXT email user_id (must_keep dual-plane).
        At least one of new_password (≥8) or new_email required (ValidateIf).
      properties:
        user_id: { type: string, format: uuid }
        new_password: { type: string, minLength: 8 }
        new_email: { type: string, format: email }
    ResetUserPasswordData:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
paths:
  /:
    get:
      tags: [Platform]
      operationId: hrmHealth
      summary: UC-HRM-01 service health
      responses:
        '200':
          description: Health envelope (HRM-HEALTH-200)
  /metrics:
    get:
      tags: [Platform]
      operationId: hrmMetrics
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [prometheus] }
      responses:
        '200':
          description: Metrics JSON or Prometheus text
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees (OFFSET page or CD-FB-05 keyset cursor)
      description: |
        Default: page + page_size OFFSET with stable ORDER BY created_at DESC, id DESC.
        Optional `cursor` (from prior `next_cursor`) uses keyset pagination — preferred for
        export / listAllEmployees walks to avoid deep OFFSET storms (~12 pages @1k NV).
        Same resolveHrmListScope as GET /employees/summary. Not supported with view=directory.
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: include_archived
          in: query
          schema: { type: boolean }
        - name: view
          in: query
          schema: { type: string }
          description: Pass directory for mobile directory sort (cursor unsupported)
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: Ignored when cursor is set
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque keyset cursor from previous next_cursor (CD-FB-05)
      responses:
        '200':
          description: Employees listed (HRM-EMP-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeListPage'
        '400':
          description: Invalid cursor (HRM-EMP-CURSOR-001) or cursor+directory (HRM-EMP-CURSOR-002)
        '401':
          description: Unauthorized (HRM-AUTH-001)
  /employees/summary:
    get:
      tags: [Employees]
      operationId: getEmployeesSummary
      summary: P1-HRM-PERF-BE-01 — dashboard employee aggregates (single round-trip)
      description: |
        Returns scoped counts, payroll totals, department breakdown, per-company (operating slug)
        headcounts (`by_company`), salary ranges, and recent hires.
        Uses the same resolveHrmListScope filters as GET /employees (group CEO company_id=main rollup).
        Replaces N sequential paginated list calls for dashboard/count widgets.
        D-HRM-CO-EMP-COUNT-BE-01 / GOV-HRM-CO-EMP-TS-01: `by_company[].company_id` is Plane B slug only
        (not XBOS LE UUID). Physical contract: docs/hrm/TECHSPEC.md §19 · ref_srs FR-HRM-CO-HC-01 / UC-HRM-CO-01.
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Employee summary envelope (HRM-EMP-SUMMARY-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeSummary'
        '401':
          description: Unauthorized (HRM-AUTH-001)
  /employees/{employeeId}:
    get:
      operationId: getEmployeeById
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Employee envelope (HRM-EMP-200)
        '404':
          description: Employee not found (HRM-EMP-404)
  /decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: UC-HRM-27 — list HR decisions
      description: |
        Returns a scoped decision list. Empty result sets are valid live responses (`total: 0`, `data: []`).
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: decision_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: status
          in: query
          schema: { type: string, maxLength: 32 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Decisions listed (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecisionList'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '409':
          description: SCOPE_CONTEXT_MISMATCH
    post:
      tags: [Decisions]
      operationId: createDecision
      summary: UC-HRM-27 — create HR decision
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision created (HRM-DEC-201)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecision'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /decisions/{decisionId}:
    get:
      tags: [Decisions]
      operationId: getDecisionById
      summary: UC-HRM-27 — get HR decision by id
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      responses:
        '200':
          description: Decision detail (HRM-DEC-200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HrDecision'
        '401':
          description: Unauthorized (HRM-AUTH-001)
        '404':
