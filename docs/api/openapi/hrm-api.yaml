  /spreadsheet/import/preview:
    post:
      tags: [Spreadsheet]
      operationId: sheetPreview
      summary: FR-HRM-IM-01 / HRM-IM-01 — preview employee import (non-persist)
      description: |
        API_DESIGN Endpoint A (F.1) · docs/hrm/API_DESIGN_HRM_IMPORT_PREVIEW.md §A ·
        DB_DESIGN_HRM_IMPORT_PREVIEW.md (N/A table — no staging invent).
        Mục đích: Cho phép HCNS tải tệp import nhân sự và xem trước bảng dòng hợp lệ / lỗi từng dòng
        trước khi xác nhận import — không tạo hồ sơ nhân viên hàng loạt.
        Nghiệp vụ: Auth (HRM-AUTH-001) → resolveScopeContext → kind=employee_import → require multipart
        field `file` → assertImportUploadMime → parse csv/xlsx → validateEmployeeImportRow →
        SHEET-200 { previewRows, errors, truncated, dryRun } — **zero INSERT/UPDATE** employees.
        dryRun mặc định true khi omit; string 'false' vẫn không ghi DB trên preview path.
        Bước SRS: FR-HRM-IM-01 / UC HRM-IM-01 Diễn biến #1–#8 (khách SRS_HRM_KHACH.md §3.32).
        #4 catalog sync + duplicate employee_code DB = residual G-IM-CATALOG-01 (in-memory only today).
        Runtime: SpreadsheetController.importPreview → SpreadsheetService.previewEmployeeImport.
        Envelope: SHEET-200 · message `Import preview`. must_keep: IM-01 non-persist · U65 · no claim IM-02 DONE.
        HTTP status: 200 (SoT API_DESIGN §A · SRS team Network 200 · Nest @HttpCode(OK) — not Nest POST default 201).
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
      requestBody:
        required: true
        description: multipart/form-data — field name `file` required (FileInterceptor)
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX employee import workbook
                kind:
                  type: string
                  enum: [employee_import]
                  description: ImportMultipartMetaDto — employee_import only
                dryRun:
                  type: string
                  enum: ['true', 'false']
                  description: Default true when omitted; preview path never persists
            encoding:
              file:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '200':
          description: HTTP 200 · SHEET-200 — Import preview (may include row errors[] with code SHEET-422)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      code: { type: string, const: SHEET-200 }
                      data:
