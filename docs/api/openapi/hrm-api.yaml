  /fleet/vehicles:
    get:
      tags: [Fleet]
      operationId: fleetListVehicles
      summary: FR-HRM-FL-01 — list fleet vehicles (view-only)
      description: |
        API_DESIGN Endpoint A (F.1) · docs/hrm/API_DESIGN_HRM_FLEET.md §A ·
        DB_DESIGN_HRM_FLEET.md · table public.hrm_fleet_vehicles (TEXT company_id Plane B).
        Mục đích: Cấp danh sách hồ sơ xe trong phạm vi đơn vị để bảng Hồ sơ xe hiển thị đúng biển số —
        empty trung thực khi chưa khai xe; không lộ xe đơn vị khác.
        Nghiệp vụ: Auth (HRM-AUTH-001) → resolveScopeContext → resolveHrmListScope (company_id query/header;
        main rollup → member slug array) → filter tenant_id + company_id IN scope → optional status ∈
        active|inactive → optional keyword|q ILIKE license_plate + soft name keys in fleet_fields
        (driver_name, manufacturer, model, route_name, name, vehicle_name) → limit clamp 1..2000
        (default 500) → ORDER BY license_plate ASC → HRM-FLEET-200 { total, data[] }.
        Empty = total=0, data=[] (not ERROR). No side-effect seed; no write.
        GET by id = residual G-FL-01 (not this operation). Keyword filter = CLOSED G-FL-02 (BE-HRM-FLEET-KEYWORD-01).
        Bước SRS: FR-HRM-FL-01 Diễn biến #1/#2/#3/#4/#6/#8 (khách SRS_HRM_KHACH.md §3.49).
        Runtime: FleetController.listVehicles → FleetService.listVehicles.
        must_keep: FL-01 GET list only · TEXT slug · U65 no seed · service upsertVehicle not public HTTP.
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CompanyHeader'
        - name: company_id
          in: query
          required: false
          description: Optional Plane B slug override; else x-company-id / JWT scope
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, inactive] }
        - name: keyword
          in: query
          required: false
          description: |
            F.1 · FR-HRM-FL-01 #4 — tìm biển số / tên trong ĐV (ILIKE).
            Prefer `q` when both set. Matches license_plate + fleet_fields name keys.
            Empty/omit = no keyword filter (full in-scope list / empty OK).
          schema: { type: string, maxLength: 100 }
        - name: q
          in: query
          required: false
          description: Alias of keyword; wins over keyword when both present (employees parity)
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: Clamp 1..2000; default 500
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: HRM-FLEET-200 — Fleet vehicles listed (empty in-scope is valid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      code: { type: string, const: HRM-FLEET-200 }
                      data:
                        $ref: '#/components/schemas/FleetVehicleList'
              examples:
                emptyHonest:
                  summary: FR-HRM-FL-01 #3 empty trung thực
                  value:
                    code: HRM-FLEET-200
                    message: Fleet vehicles listed
                    data:
                      total: 0
                      data: []
        '401':
          description: HRM-AUTH-001 — Unauthorized fleet access
        '409':
          description: SCOPE_CONTEXT_MISMATCH (standing G-SCOPE-01)
