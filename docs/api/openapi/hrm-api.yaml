          description: HRM-ADMIN-202 — Company admin created or updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      code: { type: string, const: HRM-ADMIN-202 }
