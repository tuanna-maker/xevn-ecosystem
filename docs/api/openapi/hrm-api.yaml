    get:
      tags: [ContractsInsurance]
      operationId: listLaborContracts
      summary: HRM-CI-03
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/contracts/expiring:
    get:
      tags: [ContractsInsurance]
      operationId: listExpiringContracts
      summary: HRM-CI-04
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/contracts/{contractId}:
    patch:
      tags: [ContractsInsurance]
      operationId: updateLaborContract
      summary: HRM-CI-05
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-CON-200
    delete:
      tags: [ContractsInsurance]
      operationId: deleteLaborContract
      summary: HRM-CI-06
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/insurance:
    post:
      tags: [ContractsInsurance]
      operationId: createInsuranceRecord
      summary: HRM-CI-02
      responses:
        '200':
          description: HRM-CON-202
    get:
      tags: [ContractsInsurance]
      operationId: listInsuranceRecords
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: HRM-CON-200
  /contracts-insurance/insurance/expiring:
    get:
      tags: [ContractsInsurance]
      operationId: listExpiringInsurance
      summary: HRM-CI-07
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: days
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: HRM-CON-200
  /employee-metadata/change-requests:
    post:
      tags: [Metadata]
      operationId: metaSubmit
      summary: HRM-MD-01 — submit metadata change request
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, employee_id, field_key, requested_value]
      responses:
        '200':
          description: HRM-META-201
        '409':
          description: SCOPE_CONTEXT_MISMATCH
    get:
      tags: [Metadata]
      operationId: metaList
      summary: HRM-MD-02 — list pending metadata changes
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: HRM-META-200
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /employee-metadata/change-requests/{changeRequestId}/approve:
    post:
      tags: [Metadata]
      operationId: metaApprove
      summary: HRM-MD-03 — approve metadata change
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: changeRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-META-202
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /employee-metadata/change-requests/{changeRequestId}/reject:
    post:
      tags: [Metadata]
      operationId: metaReject
      summary: HRM-MD-04 — reject metadata change
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: changeRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-META-203
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /employee-metadata/audit-logs:
    get:
      tags: [Metadata]
      operationId: metaAuditLog
      summary: HRM-MD-05 — metadata audit trail
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: employee_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: HRM-META-204
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /spreadsheet/limits:
    get:
      tags: [Spreadsheet]
      operationId: sheetLimits
      summary: Spreadsheet upload/export caps
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      responses:
        '200':
          description: SHEET-200
  /spreadsheet/templates/{kind}:
    get:
      tags: [Spreadsheet]
      operationId: sheetTemplate
      summary: HRM-IM-04 — download import template
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [employee_import] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        '200':
          description: Template file (csv or xlsx)
        '400':
          description: SHEET-400
  /spreadsheet/import/preview:
    post:
      tags: [Spreadsheet]
      operationId: sheetPreview
      summary: HRM-IM-01 — preview employee import
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [employee_import] }
                dryRun: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: SHEET-200 preview envelope
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /spreadsheet/import/commit:
    post:
      tags: [Spreadsheet]
      operationId: sheetCommit
      summary: HRM-IM-02 — commit employee import
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { type: string, enum: [employee_import] }
      responses:
        '200':
          description: SHEET-201
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /spreadsheet/export:
    post:
      tags: [Spreadsheet]
      operationId: sheetExport
      summary: HRM-IM-03 — export employee list CSV
      security: [{ bearerAuth: [] }, { internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter]
              properties:
                filter:
                  type: object
                  properties:
                    company_id: { type: string }
      responses:
        '200':
          description: CSV attachment
        '409':
          description: SCOPE_CONTEXT_MISMATCH
  /operations/tasks:
