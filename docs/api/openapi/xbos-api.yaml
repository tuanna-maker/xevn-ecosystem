          description: Metrics JSON or Prometheus text
  /auth/login:
    post:
      tags: [Platform]
      operationId: xbosAuthLogin
      security: []
      summary: Portal login (JWT + memberships)
      responses:
        '200':
          description: XBOS-AUTH-200 envelope
  /auth/select-membership:
    post:
      tags: [M01-Tenant]
      operationId: xbosAuthSelectMembership
      summary: FR-XBOS-TENANT-01 — chọn tư cách đơn vị và re-issue JWT
      description: |
        Runtime: AuthController.selectMembership → AuthService.selectMembership.
        Requires Bearer JWT (login/me session). Body tenantId must be in caller's
        accessible memberships; otherwise XBOS-AUTH-403.
        Success envelope code: XBOS-AUTH-201 (Nest default POST status 201).
        Spec: docs/xbos/TECHSPEC.md §14.2 · §14.13 G-OA-02 / G-DTO-01.
        must_keep: UF-XBOS-01 / UF-XBOS green flows — documentation only, no behavior change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectMembershipRequest'
      responses:
        '201':
          description: XBOS-AUTH-201 — membership switched; new accessToken
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelopeSuccess'
                  - type: object
                    properties:
                      code:
                        type: string
                        const: XBOS-AUTH-201
                      data:
                        $ref: '#/components/schemas/SelectMembershipData'
        '400':
          description: Validation failed (missing/empty tenantId — class-validator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
        '401':
          description: XBOS-AUTH-401 — missing/invalid Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
        '403':
          description: XBOS-AUTH-403 — tenantId not in caller memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
  /tenant-scope/accessible:
    get:
      tags: [M01-Tenant]
