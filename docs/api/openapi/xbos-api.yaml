        '200':
          description: XBOS-CFG-201
        '400':
          description: XBOS-VAL-001 invalid target
  /config-sync/catalog/{catalogKey}/publish:
    post:
      tags: [M01-Catalog]
      operationId: configSyncPublishCatalog
      summary: UC-XBOS-02 / UC-XBOS-05 — publish catalog version
      parameters:
        - $ref: '#/components/parameters/CatalogKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCatalogBody'
      responses:
        '200':
          description: XBOS-CFG-203
  /config-sync/catalog/{catalogKey}/apply-to-members:
    post:
      tags: [M01-Catalog]
      operationId: configSyncApplyCatalogToMembers
      summary: XBOS-DM-HRM-07 / G-BM-REC-01 — fan-out catalog to member partitions (Option B)
      description: |
        Copies source `(tenantId, companyId)` catalog snapshot to selected member partitions
        via upsert (reuses publish semantics). Allow-list keys only (P0+P1 unlocked).
        Does not replace single-company publish. WF definition bind = residual G-BM-REC-02.
        Allow-list catalogKey (P0): job_titles, recruitment_channels, job_grades,
        departments, leave_types.
        Allow-list catalogKey (P1): P0 ∪ contract_types, employment_types, pay_types,
        shifts, decision_types.
        Alias path hr_decision_types → decision_types for allow-list; write key follows source L0.
      parameters:
        - $ref: '#/components/parameters/CatalogKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCatalogToMembersBody'
      responses:
        '200':
          description: XBOS-CFG-204 applied summary
        '400':
          description: XBOS-CFG-005 key not allowed · XBOS-VAL-011/012 targets
        '401':
          description: XBOS-AUTH-001
        '404':
          description: XBOS-CFG-001 source catalog missing
