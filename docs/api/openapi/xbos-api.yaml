openapi: 3.1.0
info:
  title: XeVN XBOS API — M01 Hub Contract (Phase 1 S2)
  version: 1.2.8-p1-s2
  description: |
    Canonical contract for Phase 1 Module M01 (catalog, KPI, org, tenant scope, business master, workflow).
    U18 delta: docs/architecture/P1-TECHSPEC-OPENAPI-DELTA-U18-20260524.md
    Bounded-context rules: docs/decisions/ADR-XBOS-M01-OPENAPI-BOUNDARIES.md
    Scope ladder (holding vs main, multi-membership): docs/decisions/ADR-HRM-RBAC-SCOPE-LADDER.md
    G-OA-02 / G-DTO-01: POST /auth/select-membership (BE-XBOS-OA-SELECT-MEMBERSHIP-01).
    G-OA-04 (FR-CC-P0-01): legal-entity shareholders CRUD (BE-XBOS-OA-SHAREHOLDERS-01).
    G-OA-03 / G-DTO-02 (FR-XBOS-ORG-03): legal-entity documents CRUD + upload + file stream (BE-XBOS-OA-LEGAL-DOCS-01).
    G-OA-W2-RACI-01 / G-DTO-W2-RACI-01 (FR-XBOS-RACI-02): raci-governance catalog/matrix/cell (+ capabilities/coverage)
      — F.1 deepen BE-XBOS-OA-RACI-CC-01 · Nest class-validator CLOSED BE-XBOS-OA-DTO-P2-01 (2026-07-27).
    G-DTO-W2-POS-01 (FR-CC-P0-04): PermissionMatrixRow + SavePermissionMatrixRequest depth
      — BE-XBOS-OA-DTO-P2-01 · API_DESIGN_XBOS_RACI_RBAC.md Endpoints E–F (2026-07-27).
    G-OA-W2-CC-CAT-01 / G-DTO-W2-CC-CAT-01 (FR-CC-P0-05): business-master command_center_catalogs kinds + row schemas
      — F.1 deepen BE-XBOS-OA-RACI-CC-01 · API_DESIGN Endpoints H–I (2026-07-27).
    G-DTO-W2-KPI-01 (FR-XBOS-KPI-03): KpiRollupData series/points + evaluate/actuals/alerts F.1
      — BE-XBOS-OA-KPI-DTO-01 · API_DESIGN_XBOS_KPI.md Endpoints A–E (2026-07-27).
servers:
  - url: /api/xbos
tags:
  - name: Platform
    description: Health, metrics (NFR)
  - name: M01-Catalog
    description: UC-XBOS-02..05, UC-XBOS-SYNC-01 — config-sync + catalog-governance
  - name: M01-KPI
    description: UC-XBOS-KPI-01..04 — kpi-engine (math source of truth)
  - name: M01-Org
    description: UC-XBOS-ORG-01..03, UC-XBOS-10..12 — org-foundation, position-rbac
  - name: M01-Tenant
    description: Global filter / membership — tenant-scope
  - name: M01-Master
    description: UC-XBOS-MD-01..07, UC-XBOS-08 — business-master domains
  - name: M01-CC
    description: Command Center presentation (not KPI math) — UC-CC-P0-09
  - name: M01-Platform-Audit
    description: UC-XBOS-06 emit path (catalog publish) — no GET /audit in S1
  - name: M01-Alerts
    description: UC-XBOS-07 satellite violation ingest
  - name: M01-WF
    description: UC-XBOS-13..15, UC-XBOS-WF-01..06, UC-XBOS-CC-06 — workflow-engine runtime
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
  parameters:
    TenantIdQuery:
      name: tenantId
      in: query
      schema: { type: string }
    CompanyIdQuery:
      name: companyId
      in: query
      schema: { type: string }
    CatalogTarget:
      name: target
      in: query
      required: true
      schema:
        type: string
        enum: [hrm, xbos, web-portal]
    CatalogKey:
      name: catalogKey
      in: path
      required: true
      schema: { type: string }
    Domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
        description: |
          Business-master domain whitelist (BusinessMasterService.allowedDomains).
          FR-CC-P0-05 / UF-XBOS-14 Command Center catalogs use `command_center_catalogs`
          (partition kinds regulations|measurements|pricing — see CommandCenterCatalogKind).
        enum:
          - companies
          - kpi_metrics
          - positions
          - vendors
          - expense_categories
          - organizations
          - customers
          - partners
          - dept_system_templates
          - command_center_catalogs
          - kpi_policies
          - kpi_sparkline_snapshots
          - department_catalog
          - departments
          - geographic_regions
          - kpi_formulas
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        description: |
          Master entry key. For domain=`command_center_catalogs` (FR-CC-P0-05 /
          API_DESIGN_XBOS_RACI_RBAC.md Endpoint I · CommandCenterCatalogKind):
          - Partition autosave: `regulations` | `measurements` | `pricing` with body `{ rows: […] }`
          - Flat row upsert: row business key (`code` / `key` / `priceCode`) + `category` kind
        examples:
          - regulations
          - measurements
          - pricing
          - QD-2026-01
          - REVENUE_YTD
          - PRC-HOLDING-01
  headers:
    XTenantId:
      schema: { type: string }
    XCompanyId:
      schema: { type: string }
    XRequestId:
      schema: { type: string, format: uuid }
  schemas:
    ApiEnvelopeSuccess:
      type: object
      required: [success, code, message, data, timestamp]
      properties:
        success: { type: boolean, const: true }
        code: { type: string, pattern: '^XBOS-' }
        message: { type: string }
        data: { type: object }
        timestamp: { type: string, format: date-time }
    ApiEnvelopeError:
      type: object
      required: [success, code, message, timestamp]
      properties:
        success: { type: boolean, const: false }
        code: { type: string }
        message: { type: string }
        details: { type: object }
        timestamp: { type: string, format: date-time }
    KpiEvaluateBody:
      type: object
      required: [target, actual]
      description: |
        POST /kpi-engine/evaluate body — Nest KpiEvaluateInput · API_DESIGN Endpoint A · UC-XBOS-KPI-01.
        Pure math; optional emitPortalAlert writes xbos_portal_alerts only (not xbos_kpi_actuals).
      properties:
        target:
          type: number
          description: Mục tiêu kỳ (plain number; FE nhóm nghìn khi hiển thị tiền)
          examples: [100, 1000]
        actual:
          type: number
          description: Thực tế kỳ
          examples: [92, 780]
        weight: { type: number, description: Hệ số trọng số (default 1) }
        warningThreshold: { type: number, description: Ngưỡng warning (default 0.8×target) }
        criticalThreshold: { type: number, description: Ngưỡng critical (default 0.6×target) }
        metricCode:
          type: string
          description: Mã chỉ số khi emit alert (default kpi_metric)
          examples: [otif, revenue_growth]
        emitPortalAlert:
          type: boolean
          description: true → insert rail alert khi band warning|critical
    KpiBand:
      type: string
      description: Band đánh giá KPI (evaluate)
      enum: [excellent, warning, critical]
    KpiEvaluateResult:
      type: object
      required: [score, band, rewardAmount, penaltyAmount, netAmount, ratio]
      description: |
        Computed evaluate payload (no actuals row) · API_DESIGN Endpoint A DTO↔DB computed.
        G-DTO-W2-KPI-01 CLOSED (BE-XBOS-OA-KPI-DTO-01).
      properties:
        score: { type: number, description: Điểm 0..n (ratio×100×weight) }
        band: { $ref: '#/components/schemas/KpiBand' }
        rewardAmount: { type: number }
        penaltyAmount: { type: number }
        netAmount: { type: number }
        ratio: { type: number, description: actual/target (0 nếu target≤0) }
        alertId:
          type: ['string', 'null']
          description: xbos_portal_alerts.id khi emitPortalAlert
    KpiEvaluateBatchRequest:
      type: object
      description: |
        POST /kpi-engine/evaluate-batch · API_DESIGN Endpoint B · UC-XBOS-KPI-02.
        Empty items → empty results (valid).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KpiEvaluateBody'
        tenantId: { type: string }
        companyId: { type: string }
        emitPortalAlerts:
          type: boolean
          description: Batch emit alerts per warning/critical item
    KpiEvaluateBatchData:
      type: object
      required: [results, alerts]
      description: Envelope data XBOS-KPI-201
      properties:
        results:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  index: { type: integer }
              - $ref: '#/components/schemas/KpiEvaluateResult'
        alerts:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index: { type: integer }
              alertId: { type: ['string', 'null'] }
    KpiRollupPoint:
      type: object
      required: [period, actual]
      description: |
        One period point in rollup series — maps xbos_kpi_actuals (period_date / actual_value / target_value).
        Group mode: SUM(actual) · AVG(target). Null target → FE «—».
      properties:
        period:
          type: string
          format: date
          description: period_date ISO yyyy-MM-dd (FE display dd/MM/yyyy)
          examples: ['2026-06-01', '2026-07-01']
        actual:
          type: number
          description: actual_value (SUM if rollupMode=group)
          examples: [920, 1500]
        target:
          type: ['number', 'null']
          description: target_value (AVG if group; null ok)
          examples: [1000, null]
    KpiRollupSeries:
      type: object
      required: [metricCode, points]
      description: |
        One metric series for Command Center KPI widget — FR-XBOS-KPI-03 / UF-XBOS-10.
        Empty points array inside series is rare; empty top-level series[] = Diễn biến #5.
      properties:
        metricCode:
          type: string
          description: xbos_kpi_actuals.metric_code
          examples: [otif, on_time_delivery]
        points:
          type: array
          items:
            $ref: '#/components/schemas/KpiRollupPoint'
    KpiRollupData:
      type: object
      required: [tenantId, companyId, rollupMode, companyIds, from, to, series]
      description: |
        GET /kpi-engine/rollup success data — API_DESIGN Endpoint C · FR-XBOS-KPI-03 · G-DTO-W2-KPI-01 CLOSED.
        Read-only; series: [] valid (U65 — không fake số).
      properties:
        tenantId:
          type: string
          examples: [xevn]
        companyId:
          type: string
          description: Resolved scope slug (holding|main|member)
          examples: [holding, main]
        rollupMode:
          type: string
          enum: [group, single]
          description: group when companyId ∈ {holding, all}
        companyIds:
          type: array
          items: { type: string }
          description: Expanded GROUP_ROLLUP_COMPANY_IDS or [companyId]
        from:
          type: string
          format: date
          description: Effective window start (default now−180d)
        to:
          type: string
          format: date
          description: Effective window end (default today)
        series:
          type: array
          description: Multi-metric time series; empty = trung thực không có chỉ số kỳ
          items:
            $ref: '#/components/schemas/KpiRollupSeries'
    KpiPortalAlertLevel:
      type: string
      enum: [info, warning, critical]
    KpiPortalAlert:
      type: object
      required: [id, module_code, level, title, created_at]
      description: |
        Row from xbos_portal_alerts (list wire uses snake_case columns) · API_DESIGN Endpoint D.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        company_id: { type: ['string', 'null'] }
        module_code: { type: string, examples: [kpi-engine, system] }
        level: { $ref: '#/components/schemas/KpiPortalAlertLevel' }
        title: { type: string }
        detail: { type: ['string', 'null'] }
        source_system: { type: string }
        source_id: { type: ['string', 'null'] }
        created_at: { type: string, format: date-time }
    KpiPortalAlertListData:
      type: object
      required: [items]
      description: GET portal-alerts envelope data XBOS-KPI-203 · empty items valid
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KpiPortalAlert'
    PublishPortalAlertRequest:
      type: object
      required: [moduleCode, title]
      description: |
        POST /kpi-engine/portal-alerts body · API_DESIGN Endpoint E · UC-XBOS-KPI-04.
      properties:
        tenantId: { type: string }
        companyId: { type: string }
        moduleCode:
          type: string
          minLength: 1
          examples: [kpi-engine]
        level:
          $ref: '#/components/schemas/KpiPortalAlertLevel'
        title: { type: string, minLength: 1 }
        detail: { type: string }
        sourceSystem: { type: string }
        sourceId: { type: string }
    PublishPortalAlertData:
      type: object
      required: [id]
      description: INSERT return · xbos_portal_alerts.id · XBOS-KPI-204
      properties:
        id: { type: string, format: uuid }
    PublishCatalogBody:
      type: object
      description: See PublishCatalogDto in config-sync module
    ApplyCatalogToMembersBody:
      type: object
      required: [tenantId, companyId]
      description: |
        Option B fan-out (XBOS-DM-HRM-07 / G-BM-REC-01 / E-XBOS-CTRL-G1).
        Source = tenantId+companyId (typically xevn/holding).
        Provide targets[] (cross-tenant) and/or memberCompanyIds[] (same-tenant shorthand).
        Allow-list catalogKey (P0): job_titles, recruitment_channels, job_grades,
        departments, leave_types.
        Allow-list catalogKey (P1): P0 ∪ contract_types, employment_types, pay_types,
        shifts, decision_types.
        Alias path hr_decision_types → decision_types for allow-list; write key follows source L0.
      properties:
        tenantId: { type: string }
        companyId: { type: string }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [tenantId, companyId]
            properties:
              tenantId: { type: string }
              companyId: { type: string }
        memberCompanyIds:
          type: array
          minItems: 1
          items: { type: string }
        actor: { type: string }
    SelectMembershipRequest:
      type: object
      required: [tenantId]
      description: |
        SelectMembershipDto (Nest). FR-XBOS-TENANT-01 / UC-HRM-SCOPE-04.
        tenantId must match an active membership for the Bearer subject.
      properties:
        tenantId:
          type: string
          minLength: 1
          description: Target tenant_id (case-insensitive match against memberships)
          example: xe-du-lich
    AccessibleTenantMembership:
      type: object
      required: [tenantId, companyId, roleCode]
      description: AccessibleTenant row from tenant-scope.listAccessible
      properties:
        tenantId: { type: string }
        name: { type: string }
        shortName: { type: string }
        tenantKind:
          type: string
          enum: [master, member]
        roleCode: { type: string }
        companyId: { type: string }
        isMaster: { type: boolean }
    SelectMembershipData:
      type: object
      required:
        - accessToken
        - expiresInSec
        - membership
        - memberships
        - defaultTenantId
        - defaultCompanyId
      description: JWT re-issue payload after membership switch (envelope code XBOS-AUTH-201)
      properties:
        accessToken: { type: string, description: Portal JWT with selected tenantId/companyId/roleCode }
        expiresInSec: { type: integer, minimum: 1 }
        membership:
          $ref: '#/components/schemas/AccessibleTenantMembership'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/AccessibleTenantMembership'
        defaultTenantId: { type: string }
        defaultCompanyId: { type: string }
    CreateShareholderRequest:
      type: object
      required: [holderName]
      description: |
        ShareholderInput (Nest legal-entity-profile). camelCase body.
        FR-CC-P0-01 / UC-CC-P0-01 · TechSpec §14.6 · CC P0 §2–4.
      properties:
        holderName:
          type: string
          minLength: 1
          description: Required; trimmed; empty → XBOS-SHR-400
        identityCode:
          type: string
          description: Optional CCCD/MST/identity
        ratioPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Ownership percent 0–100; default 0
        contributedValue:
          type: number
          minimum: 0
          description: Contributed capital amount (numeric; FE may format vi-VN)
    UpdateShareholderRequest:
      type: object
      description: |
        Partial ShareholderInput — COALESCE on update. At least one field typical for UF mutate.
      properties:
        holderName: { type: string, minLength: 1 }
        identityCode: { type: string, nullable: true }
        ratioPercent: { type: number, minimum: 0, maximum: 100 }
        contributedValue: { type: number, minimum: 0 }
    LegalEntityShareholder:
      type: object
      description: |
        Row from public.xbos_legal_entity_shareholder (SELECT * — snake_case columns).
        Active-only on list; soft-delete sets status=deleted.
      required: [id, tenant_id, company_id, legal_entity_id, holder_name, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        company_id: { type: string }
        legal_entity_id: { type: string, format: uuid }
        holder_name: { type: string }
        identity_code: { type: string, nullable: true }
        ratio_percent: { type: number }
        contributed_value: { type: number }
        status:
          type: string
          enum: [active, deleted]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShareholderListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntityShareholder'
    ShareholderDeletedData:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    CreateDocumentRequest:
      type: object
      required: [documentName]
      description: |
        DocumentInput (Nest legal-entity-profile). camelCase body.
        FR-XBOS-ORG-03 / UC-XBOS-ORG-03 · TechSpec §14.5 · §14.13 G-OA-03 / G-DTO-02 · CC P0 §2–4.
      properties:
        documentName:
          type: string
          minLength: 1
          description: Required; trimmed; empty → XBOS-DOC-400
        documentCode:
          type: string
          description: Optional document code / số hiệu
        issuedDate:
          type: string
          format: date
          description: Optional issued date (YYYY-MM-DD)
        expiredDate:
          type: string
          format: date
          description: Optional expiry date (YYYY-MM-DD)
    UpdateDocumentRequest:
      type: object
      description: |
        Partial DocumentInput — COALESCE on update. G-DTO-02 field↔column matrix.
      properties:
        documentName: { type: string, minLength: 1 }
        documentCode: { type: string, nullable: true }
        issuedDate: { type: string, format: date, nullable: true }
        expiredDate: { type: string, format: date, nullable: true }
    LegalEntityDocument:
      type: object
      description: |
        Row from public.xbos_legal_entity_document (SELECT * — snake_case columns).
        Active-only on list; soft-delete sets status=deleted.
        G-DTO-02: request camelCase ↔ response snake_case.
      required: [id, tenant_id, company_id, legal_entity_id, document_name, status]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        company_id: { type: string }
        legal_entity_id: { type: string, format: uuid }
        document_code: { type: string, nullable: true }
        document_name: { type: string }
        issued_date: { type: string, format: date, nullable: true }
        expired_date: { type: string, format: date, nullable: true }
        file_url: { type: string, nullable: true, description: Public GET …/legal-documents/{id}/file URL after upload }
        storage_path: { type: string, nullable: true, description: Relative storage key under XBOS_LEGAL_DOC_STORAGE_ROOT }
        mime_type: { type: string, nullable: true }
        file_size: { type: integer, nullable: true }
        status:
          type: string
          enum: [active, deleted]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntityDocument'
    DocumentDeletedData:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    UpsertRaciMatrixCellRequest:
      type: object
      required: [activity_id, org_column_id]
      description: |
        Runtime body for PUT …/matrix/cell (snake_case). TechSpec §14.14 FR-XBOS-RACI-02 · G-DTO-W2-RACI-01 CLOSED.
        Nest: UpsertRaciMatrixCellRequestDto (class-validator + ValidationPipe whitelist).
        Letters pattern ^[RACI]*$ (empty string clears override). Edge invalid → XBOS-VAL-001; service letters → XBOS-RACI-400.
      properties:
        activity_id:
          type: string
          minLength: 1
          description: Catalog activity UUID (not seed-* prefix — else XBOS-RACI-503)
        org_column_id:
          type: string
          minLength: 1
          description: Org column key (e.g. hdqt, ceo, hcns)
        raci_letters:
          type: string
          pattern: '^[RACI]*$'
          description: R/A/C/I combination; empty = clear override; whitespace stripped + uppercased at edge
        actor_id:
          type: string
          description: Optional actor for audit / updated_by
    PermissionDataScope:
      type: string
      description: FE Settings data-scope enum (UF-XBOS-13) · default personal
      enum: [personal, department, legal_entity, group]
      examples: [personal, department, legal_entity, group]
    PermissionMatrixRow:
      type: object
      required: [rowId]
      description: |
        One Settings permission checkbox row — API_DESIGN Endpoint E/F · FR-CC-P0-04 · G-DTO-W2-POS-01 CLOSED.
        Maps to xbos_cc_permission_matrix_cell (row_id + flags + data_scope). Empty rowId skipped on save.
      properties:
        rowId:
          type: string
          description: Stable row id (e.g. pm-org-1 … pm-sys-3)
          examples: [pm-org-1, pm-hr-2, pm-sys-3]
        view: { type: boolean, description: Quyền xem }
        write: { type: boolean, description: Quyền ghi }
        delete: { type: boolean, description: Quyền xóa }
        approve: { type: boolean, description: Quyền duyệt }
        dataScope:
          $ref: '#/components/schemas/PermissionDataScope'
    SavePermissionMatrixRequest:
      type: object
      required: [roleId, rows]
      description: |
        PUT /position-rbac/matrix body — Nest SavePermissionMatrixRequestDto · API_DESIGN Endpoint F.
        Tenant-only scope; does not mutate other role_id partitions.
      properties:
        roleId:
          type: string
          minLength: 1
          description: Chức danh / role id đang chọn trên Settings
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PermissionMatrixRow'
    PermissionMatrixData:
      type: object
      required: [roleId, rows]
      description: GET/PUT matrix success data envelope (XBOS-POS-200 / XBOS-POS-201)
      properties:
        roleId: { type: string }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PermissionMatrixRow'
    RaciDomainSummary:
      type: object
      required: [domain_code, domain_label, count]
      properties:
        domain_code: { type: string }
        domain_label: { type: string }
        count: { type: integer, minimum: 0 }
    RaciActivityRow:
      type: object
      required: [id, activity_code, domain_code, domain_label, seq_no, name, default_matrix]
      description: Row from raci_activity_catalog (merged with seed fallback when DB empty)
      properties:
        id: { type: string }
        activity_code: { type: string }
        domain_code: { type: string }
        domain_label: { type: string }
        seq_no: { type: integer }
        name: { type: string }
        default_matrix:
          type: object
          additionalProperties: { type: string }
          description: Map org_column_id → default RACI letters
    RaciCatalogData:
      type: object
      required: [domains, activities, total]
      description: GET /raci-governance/catalog data envelope
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/RaciDomainSummary'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/RaciActivityRow'
        total: { type: integer, minimum: 0 }
    RaciMatrixRow:
      type: object
      required: [activity_id, activity_code, domain_code, domain_label, seq_no, name, matrix]
      description: Merged template + company_raci_matrix_cell overrides
      properties:
        activity_id: { type: string }
        activity_code: { type: string }
        domain_code: { type: string }
        domain_label: { type: string }
        seq_no: { type: integer }
        name: { type: string }
        matrix:
          type: object
          additionalProperties: { type: string }
          description: Map org_column_id → effective RACI letters
        has_override: { type: boolean }
    RaciCompanyMatrixData:
      type: object
      required: [company_id, rows]
      description: GET …/companies/{companyId}/matrix data
      properties:
        company_id:
          type: string
          description: Echo of path companyId (slug or legal-entity UUID)
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RaciMatrixRow'
    CompanyRaciMatrixCell:
      type: object
      description: |
        RETURNING * from public.company_raci_matrix_cell after upsert (snake_case).
        Envelope code XBOS-RACI-201 (HTTP 200 Nest PUT).
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        company_id: { type: string }
        activity_id: { type: string, format: uuid }
        org_column_id: { type: string }
        raci_letters: { type: string }
        source: { type: string }
        updated_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RaciCapabilityRow:
      type: object
      description: raci_ecosystem_capability join activity (or sample JSON fallback)
      properties:
        id: { type: string, format: uuid }
        activity_code: { type: string }
        activity_name: { type: string }
        module_code: { type: string }
        feature_code: { type: string }
        permission_code: { type: string }
        workflow_id: { type: string, nullable: true }
        api_route: { type: string, nullable: true }
        raci_letter_required: { type: string }
        status: { type: string }
    RaciCapabilityListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RaciCapabilityRow'
    RaciCoverageData:
      type: object
      required:
        - company_id
        - activities_total
        - activities_with_capability_map
        - activities_with_matrix_letters
        - capability_coverage_pct
      description: GET …/companies/{companyId}/coverage aggregate
      properties:
        company_id: { type: string }
        activities_total: { type: integer, minimum: 0 }
        activities_with_capability_map: { type: integer, minimum: 0 }
        activities_with_matrix_letters: { type: integer, minimum: 0 }
        capability_coverage_pct: { type: integer, minimum: 0, maximum: 100 }
    CommandCenterCatalogKind:
      type: string
      description: |
        FR-CC-P0-05 / UF-XBOS-14 / API_DESIGN Endpoint H–I — Command Center catalog partition kinds
        (COMMAND_CENTER_CATALOG_KINDS). Stored as item_id under domain command_center_catalogs.
        Diễn biến #2 list · #5 autosave partition/flat.
      enum: [regulations, measurements, pricing]
      examples: [regulations, measurements, pricing]
    CcRegulationRow:
      type: object
      required: [code, title]
      description: Văn bản / quy định row — TechSpec §14.16 FR-CC-P0-05 · G-DTO-W2-CC-CAT-01
      properties:
        code: { type: string, minLength: 1, description: Business key (also flat itemId) }
        title: { type: string }
        category:
          type: string
          enum: [regulations]
          description: Required on flat upsert; optional inside partition rows
        version: { type: string, description: Default v1.0 when omitted }
        active: { type: boolean, description: Default true when omitted }
    CcMeasurementRow:
      type: object
      required: [key, unit, currency, precision]
      description: Đo lường row — TechSpec §14.16 · G-DTO-W2-CC-CAT-01
      properties:
        key: { type: string, minLength: 1, description: Business key (also flat itemId) }
        unit: { type: string }
        currency: { type: string, description: Default VND when omitted on FE }
        precision: { type: number }
        category:
          type: string
          enum: [measurements]
    CcPricingRow:
      type: object
      required: [priceCode, label, amount]
      description: |
        Giá row — TechSpec §14.16 · G-DTO-W2-CC-CAT-01.
        `amount` = plain number on wire (FE groups thousands for display only).
      properties:
        priceCode: { type: string, minLength: 1, description: Business key (also flat itemId) }
        label: { type: string }
        amount: { type: number, description: Plain numeric amount (not thousand-grouped string) }
        category:
          type: string
          enum: [pricing]
    CommandCenterCatalogPartitionBody:
      type: object
      required: [rows]
      description: |
        PUT …/business-master/command_center_catalogs/items/{kind} body when itemId ∈
        regulations|measurements|pricing (partition autosave). FE commandCenterCatalogApi.saveCcCatalogRows.
      properties:
        rows:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CcRegulationRow'
              - $ref: '#/components/schemas/CcMeasurementRow'
              - $ref: '#/components/schemas/CcPricingRow'
      examples:
        regulationsPartition:
          summary: Autosave regulations partition
          value:
            rows:
              - code: QD-2026-01
                title: Quy chế quản trị nội bộ
                version: v1.0
                active: true
        measurementsPartition:
          summary: Autosave measurements partition
          value:
            rows:
              - key: REVENUE_YTD
                unit: VND
                currency: VND
                precision: 0
        pricingPartition:
          summary: Autosave pricing partition
          value:
            rows:
              - priceCode: PRC-HOLDING-01
                label: Phí dịch vụ tập đoàn
                amount: 1500000
    CommandCenterCatalogFlatUpsertBody:
      type: object
      description: |
        Flat row PUT when itemId = business key (code|key|priceCode).
        Runtime merges into category partition (BusinessMasterService upsert CC path).
        Requires category ∈ regulations|measurements|pricing (or kind alias).
      properties:
        code: { type: string }
        title: { type: string }
        key: { type: string }
        unit: { type: string }
        currency: { type: string }
        precision: { type: number }
        priceCode: { type: string }
        label: { type: string }
        amount: { type: number }
        version: { type: string }
        active: { type: boolean }
        category:
          $ref: '#/components/schemas/CommandCenterCatalogKind'
        kind:
          $ref: '#/components/schemas/CommandCenterCatalogKind'
          description: Alias accepted by runtime when category omitted
      examples:
        flatRegulation:
          summary: Flat regulations row (UF-XBOS-14 mirror)
          value:
            code: QD-2026-01
            title: Quy chế quản trị nội bộ
            category: regulations
            version: v1.0
            active: true
    CommandCenterCatalogListItem:
      type: object
      description: |
        One list entry under domain command_center_catalogs.
        Partition rows have id ∈ regulations|measurements|pricing and payload.rows;
        flat rows may appear with category + business key fields (FE merges both).
      properties:
        id: { type: string }
        status: { type: string }
        rows:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CcRegulationRow'
              - $ref: '#/components/schemas/CcMeasurementRow'
              - $ref: '#/components/schemas/CcPricingRow'
        code: { type: string }
        title: { type: string }
        key: { type: string }
        priceCode: { type: string }
        label: { type: string }
        amount: { type: number }
        category:
          $ref: '#/components/schemas/CommandCenterCatalogKind'
    CommandCenterCatalogListData:
      type: object
      description: |
        GET …/business-master/command_center_catalogs/items data — array of partition + flat items.
        Envelope code XBOS-MASTER-200. Empty list is valid (UF-XBOS-14).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommandCenterCatalogListItem'
