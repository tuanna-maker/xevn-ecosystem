  /kpi-engine/evaluate:
    post:
      tags: [M01-KPI]
      operationId: kpiEngineEvaluate
      summary: UC-XBOS-KPI-01 — single KPI evaluation (server math)
      description: |
        API_DESIGN Endpoint A (F.1) · docs/xbos/API_DESIGN_XBOS_KPI.md §1 · DB_DESIGN_XBOS_KPI.md.
        Mục đích: Tính điểm / band / thưởng-phạt phía server từ cặp target–actual (không ghi actuals).
        Nghiệp vụ: Auth → validate numeric (XBOS-VAL-003) → pure math → optional emitPortalAlert → xbos_portal_alerts.
        Bước SRS: UC-XBOS-KPI-01 · FR-XBOS-KPI-03 supporting (không thay rollup widget).
        Runtime: KpiEngineController.evaluate → KpiEngineService.evaluate. Envelope: XBOS-KPI-200.
        must_keep: UF-XBOS-10 🟢 · không seed actuals · RACI/WF/catalog-gov untouched.
      security:
        - bearerAuth: []
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiEvaluateBody'
            examples:
              evaluateOtif:
                summary: UC-XBOS-KPI-01 happy
                value:
                  target: 100
                  actual: 92
                  metricCode: otif
                  emitPortalAlert: false
      responses:
        '200':
          description: XBOS-KPI-200 — KpiEvaluateResult (+ alertId?)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelopeSuccess'
                  - type: object
                    properties:
                      code:
                        type: string
                        const: XBOS-KPI-200
                      data:
                        $ref: '#/components/schemas/KpiEvaluateResult'
              examples:
                evaluated:
                  summary: Band excellent
                  value:
                    success: true
                    code: XBOS-KPI-200
                    message: KPI evaluated
                    data:
                      score: 92
                      band: excellent
                      rewardAmount: 0
                      penaltyAmount: 0
                      netAmount: 0
                      ratio: 0.92
                      alertId: null
                    timestamp: '2026-07-27T10:00:00.000Z'
        '400':
          description: XBOS-VAL-003 missing numeric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
        '401':
          description: XBOS-AUTH-001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
        '409':
          description: SCOPE_CONTEXT_MISMATCH when emitPortalAlert + scope drift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeError'
  /kpi-engine/evaluate-batch:
    post:
      tags: [M01-KPI]
      operationId: kpiEngineEvaluateBatch
      summary: UC-XBOS-KPI-02 — batch KPI evaluation
      description: |
        API_DESIGN Endpoint B (F.1) · API_DESIGN_XBOS_KPI.md §2.
        Mục đích: Đánh giá nhiều chỉ số một lần (bảng KPI / Option B) — cùng công thức evaluate.
        Nghiệp vụ: Auth → map items[] → evaluate từng phần tử (index ổn định); optional emitPortalAlerts.
        Bước SRS: UC-XBOS-KPI-02 · consumer pattern với business-master kpi_metrics.
        Envelope: XBOS-KPI-201. Empty items → empty results (valid).
      security:
        - bearerAuth: []
        - internalApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiEvaluateBatchRequest'
            examples:
              batchTwo:
                summary: UC-XBOS-KPI-02
                value:
                  items:
                    - { target: 100, actual: 90, metricCode: otif }
                    - { target: 10, actual: 2, criticalThreshold: 5, metricCode: nps }
                  emitPortalAlerts: false
      responses:
        '200':
          description: XBOS-KPI-201 — KpiEvaluateBatchData
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelopeSuccess'
                  - type: object
                    properties:
                      code:
                        type: string
                        const: XBOS-KPI-201
                      data:
                        $ref: '#/components/schemas/KpiEvaluateBatchData'
        '400':
          description: XBOS-VAL-003 per-item invalid
        '401':
          description: XBOS-AUTH-001
        '409':
          description: SCOPE_CONTEXT_MISMATCH on emit
  /kpi-engine/rollup:
    get:
      tags: [M01-KPI]
      operationId: kpiEngineRollup
      summary: FR-XBOS-KPI-03 — multi-level KPI rollup (JWT-aligned)
      description: |
        API_DESIGN Endpoint C (F.1) · API_DESIGN_XBOS_KPI.md §3 · UF-XBOS-10 · DB_DESIGN xbos_kpi_actuals.
        Mục đích: Cấp chuỗi chỉ số đa cấp (rollup) trong đúng phạm vi tư cách cho widget/rail Command Center.
        Nghiệp vụ: Auth → resolveKpiRollupScopeContext → ensure actuals schema → window from/to (default 180d)
          → group (holding|all): SUM actual / AVG target across GROUP_ROLLUP_COMPANY_IDS; else single filter
          → project KpiRollupData.series; empty series[] trung thực (Diễn biến #5) — không seed (U65).
        Bước SRS: FR-XBOS-KPI-03 Diễn biến #1 auth · #2 mở KPI · #3/#4 409 scope · #5 empty · #6 F5 · #7 XBOS-KPI-202.
        Runtime: KpiEngineController.rollup → KpiEngineService.rollup. G-DTO-W2-KPI-01 CLOSED (series depth).
        must_keep: UF-XBOS-10 🟢 · FR-ECO-SCOPE-02 · RACI/WF/catalog-gov · HOLD_DEPLOY.
      security:
        - bearerAuth: []
        - internalApiKey: []
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Window start ISO yyyy-MM-dd (default now−180d)
          examples: ['2026-01-01']
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Window end ISO yyyy-MM-dd (default today)
          examples: ['2026-07-27']
      responses:
        '200':
          description: XBOS-KPI-202 — KpiRollupData (incl. empty series)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelopeSuccess'
                  - type: object
                    properties:
                      code:
                        type: string
                        const: XBOS-KPI-202
                      data:
                        $ref: '#/components/schemas/KpiRollupData'
              examples:
                groupRollupWithSeries:
                  summary: FR-XBOS-KPI-03 #2 group CEO holding
                  value:
                    success: true
                    code: XBOS-KPI-202
                    message: KPI rollup loaded
                    data:
                      tenantId: xevn
                      companyId: holding
                      rollupMode: group
                      companyIds: [holding, main, xe-tmdv, xe-du-lich, xe-vietnam, visun]
                      from: '2026-01-28'
                      to: '2026-07-27'
                      series:
                        - metricCode: otif
                          points:
                            - { period: '2026-06-01', actual: 920, target: 1000 }
                            - { period: '2026-07-01', actual: 950, target: 1000 }
                    timestamp: '2026-07-27T10:00:00.000Z'
                emptySeries:
                  summary: FR-XBOS-KPI-03 #5 không có chỉ số kỳ
                  value:
                    success: true
                    code: XBOS-KPI-202
                    message: KPI rollup loaded
                    data:
                      tenantId: xevn
                      companyId: main
                      rollupMode: single
                      companyIds: [main]
                      from: '2026-01-28'
                      to: '2026-07-27'
                      series: []
                    timestamp: '2026-07-27T10:00:00.000Z'
        '401':
          description: XBOS-AUTH-001 — FR-XBOS-KPI-03 Diễn biến #1
          content:
            application/json:
