// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
        // FCM / Expo push — plugin applied in :app only when google-services.json is present
        classpath('com.google.gms:google-services:4.4.2')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File((System.getenv("GRADLE_PATH_RN_DIR") ? System.getenv("GRADLE_PATH_RN_DIR") + "/android" : ['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim() + "/../android")))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(System.getenv("GRADLE_PATH_JSC_DIST") ?: ['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim() + "/../dist"))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects { subproject ->
  def substRoot = System.getenv("GRADLE_SUBST_REPO_ROOT")
  def realRoot = System.getenv("GRADLE_REAL_REPO_ROOT")
  if (substRoot != null && realRoot != null) {
    def ap = subproject.projectDir.absolutePath
    if (ap.startsWith(realRoot)) {
      subproject.projectDir = new File(substRoot + ap.substring(realRoot.length()))
    }
  }
  // PCOMP-W7-MOB-WAVE-APK-01: keep intermediates off OneDrive (junction target) — avoid
  // NoSuchFileException / Kotlin different-roots races during mergeReleaseResources.
  def offOneDriveBuild = System.getenv("GRADLE_OFF_ONEDRIVE_BUILD_ROOT")
  if (offOneDriveBuild != null && !offOneDriveBuild.isEmpty()) {
    subproject.buildDir = new File(offOneDriveBuild, subproject.path.replace(':', '_'))
  }
}

// Root :app also needs off-OneDrive buildDir when env set.
def offOneDriveBuildRoot = System.getenv("GRADLE_OFF_ONEDRIVE_BUILD_ROOT")
if (offOneDriveBuildRoot != null && !offOneDriveBuildRoot.isEmpty()) {
  project.buildDir = new File(offOneDriveBuildRoot, '_root')
}