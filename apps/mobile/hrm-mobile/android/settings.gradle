// Remap autolinked module dirs from OneDrive Unicode realpath → C:\xevn-ecosystem junction (Gradle 8 variant API).
def mapProjectDirToJunction(File dir) {
  if (dir == null) return dir
  def abs = dir.absolutePath.replace('/', '\\')
  def marker = 'xevn-ecosystem'
  def idx = abs.toLowerCase().indexOf(marker)
  if (idx < 0) return dir
  def rel = abs.substring(idx + marker.length())
  if (rel.startsWith('\\')) rel = rel.substring(1)
  def mapped = new File('C:\\xevn-ecosystem', rel)
  return mapped.exists() ? mapped : dir
}

gradle.settingsEvaluated { settings ->
  settings.rootProject.children.each { descriptor ->
    def mapped = mapProjectDirToJunction(descriptor.projectDir)
    if (mapped.exists()) {
      descriptor.projectDir = mapped
    }
  }
}

